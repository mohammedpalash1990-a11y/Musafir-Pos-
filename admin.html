const spark=(v,c)=>{v=v.length>1?v:[0,0];const mx=Math.max(1,...v),w=96,h=34,st=w/(v.length-1),pt=v.map((y,i)=>[i*st,h-3-(y/mx)*(h-8)]),d=pt.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');return '<svg class="spk" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><path d="'+d+' L'+w+' '+h+' L0 '+h+'Z" fill="'+c+'" opacity=".12"/><path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
const ring=(pct,lab)=>{const R=52,C=2*Math.PI*R,o=C*(1-Math.max(0,Math.min(100,pct))/100);return '<svg class="ring" viewBox="0 0 140 140" role="img" aria-label="'+esc(lab)+' '+Math.round(pct)+'%"><circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="14"/><circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--ac)" stroke-width="14" stroke-linecap="round" style="--c:'+C.toFixed(1)+'" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+o.toFixed(1)+'" transform="rotate(-90 70 70)"/><text x="70" y="68" text-anchor="middle" font-size="26" font-weight="800" fill="var(--ink)">'+Math.round(pct)+'%</text><text x="70" y="88" text-anchor="middle" font-size="11" fill="var(--mute)">'+esc(lab)+'</text></svg>'};
const months=n=>{const o=[],d=new Date();d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);o.push(x.getFullYear()+'-'+pad2(x.getMonth()+1))}return o};

 const born={},rec={};rows.forEach(r=>{const t0=r.sub&&+r.sub.t0;if(t0)born[mk(t0)]=(born[mk(t0)]||0)+1;(r.sub&&r.sub.pay||[]).forEach(p=>{if(p.t)rec[mk(p.t)]=(rec[mk(p.t)]||0)+num(p.a)})});
 const paying=rows.filter(r=>(r.sub&&r.sub.pay||[]).length).length,bv=M.map(k=>born[k]||0),rv=M.map(k=>rec[k]||0),rmax=Math.max(1,...rv),tot=rv.reduce((a,b)=>a+b,0);
 const due=all.filter(x=>x.s.d!=null&&x.s.d<=30&&x.s.d>=0&&x.s.k!='life').sort((a,b)=>a.s.d-b.s.d).slice(0,6),dep=DEPLOYED,onv=dep?rows.filter(r=>+r.ver>=+dep.release).length:0;
 const card=(n,l,v,c,go)=>'<button class="ovc" onclick="'+go+'"><span class="ovl">'+l+'</span><b>'+n+'</b>'+(v&&v.some(x=>x>0)?spark(v,c):'')+'</button>';
 const hr=new Date().getHours(),gr=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
 return '<div class="ovh"><div><h2 class="pt" style="margin:0">'+gr+'</h2><p class="mute" style="margin:4px 0 0">'+new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</p></div><div class="act"><button class="pri" onclick="window.go(\'acc\')">All accounts</button><button onclick="window.reload()">Refresh</button></div></div>'
 +'<div class="ovg">'+card(all.length,'Shops',bv,'var(--ac)',"window.fl('all');window.go('acc')")+card(live,'Live',null,'#2f7fd1',"window.fl('active');window.go('acc')")+card(soon,'Ending ≤30 days',null,'var(--amb)',"window.fl('expiring');window.go('acc')")+card(lock,'Locked / expired',null,'var(--warn)',"window.fl('expired');window.go('acc')")+'</div>'
 +'<div class="ovr"><div class="panel ovw"><div class="ovt"><h3>Receipts</h3><span class="mute">last 8 months · '+tot.toLocaleString()+' total · '+paying+' paying</span><button class="chip" onclick="window.go(\'pay\')">Payment details</button></div>'+(tot?'<div class="ovb">'+M.map((k,i)=>'<div class="ovbc" title="'+k+': '+rv[i].toLocaleString()+'"><i style="height:'+Math.max(rv[i]?6:2,rv[i]/rmax*100)+'%"></i><span>'+k.slice(5)+'</span></div>').join('')+'</div>':'<div class="empty" style="padding:30px">No payments recorded yet. Add a payment when you change a plan and it shows here.</div>')+'</div>'
 +'<div class="panel ovk"><div class="ovt"><h3>Live shops</h3></div>'+ring(all.length?live/all.length*100:0,'live')+'<p class="mute" style="text-align:center;margin:6px 0 0">'+live+' of '+all.length+' shops</p></div></div>'
 +'<div class="ovr"><div class="panel ovw"><div class="ovt"><h3>Renewals in 30 days</h3><button class="chip" onclick="window.go(\'ins\')">Insights</button></div>'+(due.map(x=>'<div class="mrow"><span style="width:auto;flex:1;color:var(--ink);word-break:break-all">'+esc(em(x.r)||x.r.name||x.r.id)+'</span><span style="width:auto">'+fmt(x.r.sub.exp)+'</span><b class="pill '+x.s.c+'">'+x.s.d+'d</b></div>').join('')||'<div class="empty" style="padding:24px">Nothing ends in the next 30 days.</div>')+'</div>'
 +'<div class="panel ovk"><div class="ovt"><h3>App version</h3></div>'+(dep?'<div class="ovv"><b>'+esc(dep.name||('P'+dep.release))+'</b><span class="mute">'+onv+' of '+rows.length+' shops on it</span></div><div class="act" style="margin-top:12px"><button onclick="window.go(\'feat\')">Release options</button></div>':'<p class="mute">version.json not found.</p>')+'</div></div>'}
/* ---- theme: circle wipe from the button ---- */

 const b=ev&&ev.currentTarget?ev.currentTarget.getBoundingClientRect():{left:innerWidth/2,top:0,width:0,height:0},x=b.left+b.width/2,y=b.top+b.height/2,end=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
